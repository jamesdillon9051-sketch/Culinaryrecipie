[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Clean URLs: /recipes/pad-thai resolves to /recipes/pad-thai/index.html
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # Widened for Adsterra. An ad network resolves creatives across redirect
    # chains of hosts it does not publish, so script-src, img-src, frame-src
    # and connect-src cannot be pinned to a domain list without ads failing
    # unpredictably. base-uri, object-src, frame-ancestors and form-action
    # stay locked down: no ad needs them, and each still blocks a real attack.
    # Escaping in the client JS remains the actual XSS defence — the old
    # script-src 'self' was defence in depth on top of it, not instead of it.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; media-src 'self' https:; frame-src 'self' https:; connect-src 'self' https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; manifest-src 'self'; upgrade-insecure-requests"

# Fingerprint-free assets change with the build, so cache them for a week and
# let the HTML (revalidated every time) pull in anything new.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
