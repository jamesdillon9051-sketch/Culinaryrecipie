# EXAMPLE ONLY: not active. Copy to .github/workflows/deploy-public-site.yml to use it, after
# reading docs/release-2026-10-followup/DEPLOYING.md. It builds and checks the site on every push
# to main and publishes only the public files to the `public-site` branch, which Hostinger's Git
# deployment can then be pointed at instead of `main`.
name: Publish the public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-public-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tools/published-dates.js reads history; the build itself does not need it

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and check
        run: |
          npm run build
          npm run check

      - name: Package the public files
        run: node tools/package-public.js --out "$RUNNER_TEMP/site"

      - name: Push them to the public-site branch
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b public-site
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Public site from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" public-site
